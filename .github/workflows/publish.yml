name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm install
        
      - name: Compile
        run: npm run compile
        
      - name: Check Secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT is empty"; else echo "VSCE_PAT is set (length: ${#VSCE_PAT})"; fi
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT is empty"; else echo "OVSX_PAT is set (length: ${#OVSX_PAT})"; fi
        
      - name: Create Release Artifact (VSIX)
        run: npx vsce package --no-dependencies
        
      - name: Publish to VS Code Marketplace
        continue-on-error: true
        run: npx vsce publish -p ${{ secrets.VSCE_PAT }} --packagePath *.vsix
        
      - name: Publish to Open VSX Registry
        continue-on-error: true
        run: npx ovsx publish -p ${{ secrets.OVSX_PAT }} --packagePath *.vsix
        
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*.vsix"
